name: CI
on: push

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dart-lang/setup-dart@v1
            - uses: bluefireteam/melos-action@v3
            - run: melos format --set-exit-if-changed
    analyze:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dart-lang/setup-dart@v1
            - uses: bluefireteam/melos-action@v3
            - run: melos analyze
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dart-lang/setup-dart@v1
            - uses: bluefireteam/melos-action@v3
            - run: melos test
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v3
            - name: Run e2e tests
              working-directory: e2e
              run: |
                  export EVM_PRIVATE_KEY="${{ secrets.EVM_PRIVATE_KEY }}"
                  export SVM_PRIVATE_KEY="${{ secrets.SVM_PRIVATE_KEY }}"
                  export EVM_ADDRESS="${{ secrets.EVM_ADDRESS }}"
                  export SVM_ADDRESS="${{ secrets.SVM_ADDRESS }}"
                  export EVM_PRIVATE_KEY_PAYER="${{ secrets.EVM_PRIVATE_KEY_PAYER }}"
                  export SVM_PRIVATE_KEY_PAYER="${{ secrets.SVM_PRIVATE_KEY_PAYER }}"
                  docker compose up --build --abort-on-container-exit --exit-code-from dart-tests
